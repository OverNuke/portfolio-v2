name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Un-gated 2026-09-17 (task 4.3): scripts/audit.mjs and e2e/*.spec.ts
      # are rebuilt against the new DOM (task 4.1/4.2).
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run audit:collage

      - run: pnpm e2e
