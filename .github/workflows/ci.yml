name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Gated 2026-09-16 (sdd/rebuild-src-from-claude-design, task 0.9):
      # scripts/audit.mjs and e2e/*.spec.ts were deleted with the old src/
      # tree and are rebuilt against the new DOM in Phase 4 (task 4.3
      # restores these three steps).
