name: Deploy to GitHub Pages

on:
  push:
    branches: [ReDesign-V3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Repo name as the base path — this workflow only ever serves a
      # project page at <owner>.github.io/<repo>/, never a user root page.
      - run: pnpm exec vite build --base=/${{ github.event.repository.name }}/

      # GitHub Pages has no SPA rewrite; on a hard refresh/deep link it
      # serves 404.html for any unmatched path, so this lets BrowserRouter
      # pick the route back up client-side.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
